name: Actualizar datos

on:
  schedule:
    - cron: "0 8 20 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar librerías
        run: pip install pandas requests eurostat statsmodels matplotlib

      - name: Extraer datos
        run: |
          python src/extract.py
          python src/extract_salarios.py

      - name: Transformar, cargar y analizar
        run: |
          python src/transform.py
          python src/load.py
          python src/analysis.py

      - name: Guardar cambios en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ docs/
          git diff --cached --quiet || (git commit -m "Actualización mensual de datos" && git push)